{{ if eq .Section "friends" }}
  {{ $friends := resources.Get "css/friends.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $friends.RelPermalink }}" integrity="{{ $friends.Data.Integrity }}" />
{{ end }}
{{ $style := resources.Get "css/site.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" />
{{ $script := resources.Get "js/site.js" | minify | fingerprint }}
<script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
