{{ $album := .Get "album" | default "life" }}
{{ $images := resources.Match (printf "media/albums/%s/*" $album) }}
<div class="gallery-slider-container" data-gallery>
  <div class="gallery-slider" tabindex="0" role="region" aria-label="{{ i18n "view_photos" }}">
    <div class="gallery-track">
      {{ range $index, $image := $images }}
        <div class="gallery-slide">
          <a href="{{ $image.RelPermalink }}">
            {{ $preview := $image.Fill "720x540 Center" }}
            <img src="{{ $preview.RelPermalink }}" alt="{{ i18n "gallery_image" (add $index 1) }}" width="720" height="540" loading="lazy">
          </a>
        </div>
      {{ end }}
    </div>
  </div>
  <div class="gallery-controls">
    <div class="gallery-nav" hidden>
      <button type="button" class="gallery-nav-btn" data-gallery-prev aria-label="{{ i18n "previous_photos" }}" disabled><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
      <div class="gallery-indicator" aria-live="polite"><span data-gallery-current>1</span> - <span data-gallery-showing>3</span> / {{ len $images }}</div>
      <button type="button" class="gallery-nav-btn" data-gallery-next aria-label="{{ i18n "next_photos" }}"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
    </div>
    <a href="{{ printf "albums/%s/" $album | relLangURL }}" class="btn-view-all"><i class="fas fa-images" aria-hidden="true"></i><span>{{ i18n "view_photos" }}</span></a>
  </div>
</div>
