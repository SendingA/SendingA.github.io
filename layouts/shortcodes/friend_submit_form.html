<!-- Friend Submission Form Shortcode - Formspree Version -->
<div id="friend-submit-form" class="friend-form-container">
  <div class="form-header">
    <h3>{{ i18n "join_friends_map" }}</h3>
    <p>{{ i18n "friends_form_intro" }}</p>
  </div>
  
  <!-- Using Formspree for form handling -->
  <form action="https://formspree.io/f/mwvnldjo" method="POST" class="friend-form">
    
    <!-- Honeypot field for spam protection -->
    <input type="text" name="_gotcha" style="display:none;" />
    
    <!-- Subject line for email -->
    <input type="hidden" name="_subject" value="🌍 New Friend Map Submission!" />
    
    <div class="form-row">
      <div class="form-group">
        <label for="friend-name">
          <i class="fas fa-user"></i> {{ i18n "friend_name" }}
        </label>
        <input type="text" id="friend-name" name="name" required placeholder="John Doe" />
      </div>
      
      <div class="form-group">
        <label for="friend-affiliation">
          <i class="fas fa-building"></i> {{ i18n "friend_affiliation" }}
        </label>
        <input type="text" id="friend-affiliation" name="affiliation" required placeholder="{{ i18n "friend_affiliation_placeholder" }}" />
      </div>
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label for="friend-city">
          <i class="fas fa-city"></i> {{ i18n "friend_city" }}
        </label>
        <input type="text" id="friend-city" name="city" required placeholder="New York" />
      </div>
      
      <div class="form-group">
        <label for="friend-country">
          <i class="fas fa-globe"></i> {{ i18n "friend_country" }}
        </label>
        <input type="text" id="friend-country" name="country" required placeholder="USA" />
      </div>
    </div>
    
    <div class="form-group full-width">
      <label for="friend-website">
        <i class="fas fa-link"></i> {{ i18n "friend_website" }}
      </label>
      <input type="url" id="friend-website" name="website" placeholder="https://yourwebsite.com" />
    </div>
    
    <div class="form-group full-width">
      <label for="friend-email">
        <i class="fas fa-envelope"></i> {{ i18n "friend_email" }}
      </label>
      <input type="email" id="friend-email" name="email" required placeholder="your@email.com" />
      <small>{{ i18n "friend_verification" }}</small>
    </div>
    
    <div class="form-group full-width">
      <label for="friend-message">
        <i class="fas fa-comment"></i> {{ i18n "friend_message" }}
      </label>
      <textarea id="friend-message" name="message" rows="3" placeholder="{{ i18n "friend_message_placeholder" }}" maxlength="200"></textarea>
      <small class="char-count"><span id="message-count">0</span>/200</small>
    </div>
    
    <div class="form-group full-width checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="friend-consent" name="consent" required />
        <span class="checkmark"></span>
        {{ i18n "friend_consent" }}
      </label>
    </div>
    
    <button type="submit" class="submit-button">
      <i class="fas fa-paper-plane"></i> {{ i18n "friend_submit" }}
    </button>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const messageInput = document.getElementById('friend-message');
  const charCount = document.getElementById('message-count');
  
  if (messageInput && charCount) {
    messageInput.addEventListener('input', function() {
      charCount.textContent = this.value.length;
    });
  }
});
</script>
