{{ $news := (where site.RegularPages "Section" "news").ByDate.Reverse }}
<div class="homepage-news-block" id="news-block-container" data-news-pagination>
  <div class="news-list" id="homepage-news-list">
    {{ range $news }}{{ partial "news-item.html" . }}{{ end }}
  </div>
  <div class="news-bottom-bar">
    <div class="bottom-left"><a href="{{ "news/" | relLangURL }}" class="btn-calendar" title="{{ i18n "archive_title" }}"><i class="fas fa-calendar-alt" aria-hidden="true"></i><span>{{ i18n "archive" }}</span></a></div>
    <div class="bottom-center"><span class="news-info">{{ i18n "news_count" (dict "Count" (len $news)) }}</span></div>
    <div class="bottom-right">
      <div class="pagination-controls" hidden>
        <button type="button" class="page-btn news-prev-btn" aria-label="{{ i18n "previous_page" }}" disabled><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
        <span class="page-indicator" aria-live="polite"><span class="news-current-page">1</span> / <span class="news-total-pages">1</span></span>
        <button type="button" class="page-btn news-next-btn" aria-label="{{ i18n "next_page" }}"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
