# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: '#about'
    weight: 10
  - name: Profile
    url: 'profile/'
    weight: 15
  # Hidden while this section contains only starter posts.
  # - name: Posts
  #   url: 'post/'
  #   weight: 20
  - name: Projects
    url: '#projects'
    weight: 30
  # Hidden until the example talk is replaced with real content.
  # - name: Talks
  #   url: 'event/'
  #   weight: 40
  - name: Publications
    url: '#featured'
    weight: 50
  # Hidden while the friends list contains demo entries.
  # - name: Friends
  #   url: 'friends/'
  #   weight: 55
  - name: Contact
    url: '#contact'
    weight: 60

